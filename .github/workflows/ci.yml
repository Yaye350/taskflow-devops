name: CI-CD TaskFlow

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: taskflow-api

jobs:
  test:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    name: Build de l'image Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
      - name: Smoke test du healthcheck
        run: |
          docker run -d --name smoke -p 5000:5000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs smoke; exit 1

  publish:
    name: Publication sur Docker Hub
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Déploiement sur la VM VirtualBox
    needs: publish
    runs-on: [self-hosted, linux, vm]   # runner installé DANS la VM
    steps:
      - uses: actions/checkout@v4
      - name: docker compose pull + up
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
      - name: Attendre le statut "healthy"
        run: |
          for i in $(seq 1 20); do
            s=$(docker inspect --format '{{.State.Health.Status}}' taskflow-api)
            echo "health = $s"
            [ "$s" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs taskflow-api; exit 1
      - run: curl -fs http://localhost:5000/health
